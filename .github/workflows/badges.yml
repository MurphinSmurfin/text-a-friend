name: badges

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --reporter=json --outputFile=test-results.json
      - run: npm run build
      - run: node scripts/badges.mjs
      - name: Commit badge data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges
          git diff --cached --quiet || git commit -m "chore: update badges"
          git push
