<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1d4ed8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <title>Text-A-Friend</title>
    <meta
      name="description"
      content="A rigged roulette wheel picks the friend you've gone longest without texting and writes the first line for you. No account. Your list stays on your phone."
    />
    <!-- No og:url or canonical on purpose: some apps open that address instead of the pasted one, which would drop #spin-9-4. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Text-A-Friend" />
    <meta
      property="og:title"
      content="Who have you gone too long without texting?"
    />
    <meta
      property="og:description"
      content="Spin the wheel. It picks a friend and writes your first line. No account, and your list stays on your phone."
    />
    <meta
      property="og:image"
      content="https://text-a-friend.vercel.app/icons/icon-512.png"
    />
    <meta property="og:image:alt" content="A speech bubble with three dots" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
